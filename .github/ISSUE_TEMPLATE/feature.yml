name: 功能建议
description: 建议与批量网页截图工作流相关的新能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述实际使用场景，而不只是实现方式
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 主要影响
      options:
        - 命令行 CLI
        - 本地网页控制台
        - 截图引擎
        - 输入或输出格式
        - 文档与安装
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: 安全边界
      options:
        - label: 该建议不要求绕过登录、验证码、付费墙或访问控制
          required: true
