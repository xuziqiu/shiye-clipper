name: Bug 报告
description: 报告可以稳定复现的截图或控制台问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传 Cookie、浏览器档案、付费内容或含个人信息的截图。

  - type: input
    id: version
    attributes:
      label: Shiye 版本
      placeholder: 例如 0.3.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows、Node.js 和 Microsoft Edge 版本
      placeholder: Windows 11 / Node 24 / Edge 版本号
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 使用入口
      options:
        - 命令行 CLI
        - 本地网页控制台
        - 两者都会出现
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可公开的复现步骤和网址
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以粘贴已去除私人路径和敏感信息的错误文本
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经移除凭据、Cookie、本地私人路径和私人网页内容
          required: true
        - label: 这个问题不是要求绕过验证码、付费墙或访问控制
          required: true
